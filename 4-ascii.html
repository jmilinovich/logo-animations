<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>mili · ASCII</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<!--
  4 · ASCII: the mili wordmark as a lit 3D object, drawn in characters.

  The wordmark's SVG paths are extruded into geometry, lit, rendered with
  WebGL, and read back through three.js' AsciiEffect, which swaps each cell
  of the frame for the glyph whose ink matches its brightness.

  It sways between three-quarter views while a low light rakes across the
  letters. Drag to spin it; let go and it turns back to face you. The living
  logo's behaviours carry over from src/living-logo.js: the i-dots blink,
  squint and glance, the smile changes mood, and holding it gets the grin
  that hovering the flat logo does.

  Query: ?charset=classic|dense|blocks|binary|mili  ?tint=phosphor|amber|ice|paper|ink  ?hud=0
  Keys:  h toggles the controls.
  Needs a network connection once, to load three.js r186 from jsDelivr.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --ink: #53d339;
    --ground: #000;
    --veil: color-mix(in srgb, var(--ground) 72%, transparent);
    --mono: "Berkeley Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  :root[data-ground="paper"] { --ground: #fff; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--ground);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .stage.grab { cursor: grabbing; }

  /* The characters. AsciiEffect sizes the type; --ls trues up the cell width,
     and the glow is in em so it stays in proportion on the finer grids. */
  .ascii { position: absolute; inset: 0; color: var(--ink); }
  .ascii table {
    margin: 0 auto;
    letter-spacing: var(--ls) !important;
    text-shadow: 0 0 0.48em color-mix(in srgb, var(--ink) 55%, transparent);
  }

  /* Scanlines and vignette, as on the demo's CRT. */
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(#0000 0 2px, #00000047 2px 3px),
      radial-gradient(#0000 55%, #000000b3 100%);
  }

  /* Ink on paper is not a CRT: no glow, no scanlines. */
  :root[data-ground="paper"] .ascii table { text-shadow: none; }
  :root[data-ground="paper"] .stage::after { display: none; }

  .hud {
    position: absolute;
    inset: 12px 14px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    color: var(--ink);
    font: 11px/1.2 var(--mono);
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 2px;
    text-shadow: 0 0 8px var(--ground), 0 0 2px var(--ground);
  }
  .brand b { font-size: 14px; letter-spacing: 0.04em; }
  .brand span { opacity: 0.6; }
  .controls { display: flex; flex-direction: column; gap: 10px; width: max-content; pointer-events: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  .hud button {
    font: inherit;
    color: var(--ink);
    background: var(--veil);
    border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent);
    padding: 3px 7px;
    cursor: pointer;
    text-transform: lowercase;
  }
  .hud button:hover { border-color: var(--ink); }
  .hud button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .hud button.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .readout {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 2;
    color: var(--ink);
    background: var(--veil);
    padding: 3px 7px;
    font: 11px var(--mono);
    letter-spacing: 0.05em;
  }
  .stage.bare .hud, .stage.bare .readout { display: none; }

  /* Fallback when three.js or WebGL is unavailable: the flat wordmark, same ink. */
  .stage > svg { position: absolute; inset: 0; margin: auto; width: min(62vw, 720px); height: auto; }
  .stage > svg path { fill: var(--ink); }

  @media (width <= 600px) {
    .readout { top: 58px; left: 14px; right: auto; }
    .brand b { font-size: 16px; }
    .hud { inset: max(12px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom)); font-size: 12px; }
    .hud button { padding: 7px 10px; }
    .row { gap: 6px; }
    .controls { gap: 14px; width: auto; }
  }
  @media (height <= 440px) and (orientation: landscape) and (pointer: coarse) {
    .hud button { padding: 5px 9px; }
  }
</style>
</head>

<script>
  // If the module below never draws (offline, CDN blocked, no WebGL), show the
  // flat wordmark instead of an empty stage.
  addEventListener('load', () => {
    const stage = document.getElementById('stage');
    if (!stage.querySelector('.ascii')) stage.innerHTML = document.getElementById('mili-svg').textContent;
  });
</script>

<script type="module">
  import * as THREE from 'three';
  import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
  import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

  const CHARSETS = {
    classic: ' .:-=+*#%@',
    dense: ' .\'`^",:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$',
    blocks: ' ░▒▓█',
    binary: ' 01',
    mili: ' .:ilm',
  };
  const TINTS = {
    phosphor: { ink: '#53d339' },
    amber: { ink: '#ffb547' },
    ice: { ink: '#9fd8ff' },
    paper: { ink: '#f1ede4' },
    ink: { ink: '#1a1a1a', ground: 'paper' },
  };

  const stage = document.getElementById('stage');
  const source = document.getElementById('mili-svg').textContent;
  const query = new URLSearchParams(location.search);
  const pick = (key, table, fallback) => (Object.hasOwn(table, query.get(key) ?? '') ? query.get(key) : fallback);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let charset = pick('charset', CHARSETS, 'classic');
  let tint = pick('tint', TINTS, 'phosphor');

  function applyTint() {
    const { ink, ground = 'black' } = TINTS[tint];
    document.documentElement.style.setProperty('--ink', ink);
    document.documentElement.dataset.ground = ground;
  }
  applyTint();

  // ── Scene ────────────────────────────────────────────────────────────────

  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const FOV = 30;
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

  // A low key light rakes across the letters, so the ramp travels along the
  // word; the rim catches side walls; the fill keeps the far end legible.
  const key = new THREE.PointLight(0xffffff, 13, 0, 2);
  key.position.set(-4, 1.6, 3.4);
  const rim = new THREE.PointLight(0xffffff, 18, 0, 1.6);
  rim.position.set(-6, -3, -2);
  const fill = new THREE.DirectionalLight(0xffffff, 0.85);
  fill.position.set(0, 0, 1);
  scene.add(key, rim, fill, new THREE.AmbientLight(0xffffff, 0.1));

  // ── The wordmark, extruded ───────────────────────────────────────────────

  const VIEW = { w: 3109, h: 2091 };          // the SVG viewBox
  const WIDTH = 5.4;                          // world units across the wordmark
  const UNIT = WIDTH / VIEW.w;
  const HEIGHT = VIEW.h * UNIT;
  const DEPTH = 260;                          // SVG units, before the bevel
  const BEVEL = 24;

  // transform-origins of the living parts, from src/living-logo.css
  const ORIGINS = { 'eye-left': [1576, 101], 'eye-right': [2689, 101], smile: [2179, 1860] };

  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.35,
    metalness: 0.1,
    flatShading: true,
  });

  const logo = new THREE.Group();
  logo.scale.set(UNIT, -UNIT, UNIT);          // SVG is y-down
  const part = {};

  for (const path of new SVGLoader().parse(source).paths) {
    const name = path.userData.node.getAttribute('class');
    const [ox, oy] = ORIGINS[name] ?? [VIEW.w / 2, VIEW.h / 2];
    const geometry = new THREE.ExtrudeGeometry(path.toShapes(), {
      depth: DEPTH,
      curveSegments: 8,
      bevelEnabled: true,
      bevelThickness: BEVEL,
      bevelSize: BEVEL,
      bevelOffset: -BEVEL,                    // keep the drawn outline as the widest point
      bevelSegments: 2,
    });
    geometry.translate(-ox, -oy, -DEPTH / 2);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(ox - VIEW.w / 2, oy - VIEW.h / 2, 0);
    mesh.userData.home = mesh.position.clone();
    logo.add(mesh);
    part[name] = mesh;
  }

  const pivot = new THREE.Group();
  pivot.add(logo);
  scene.add(pivot);

  // ── Characters ───────────────────────────────────────────────────────────

  let effect;
  let resolution;

  // The wordmark is framed to FIT of the stage, whichever side binds first.
  // The grid gets finer as the mark gets smaller on screen, so the letters
  // keep enough cells to read on a phone in either orientation.
  const FIT = { w: 0.86, h: 0.6 };
  function resolutionFor(w, h) {
    const markPx = Math.min(FIT.w * w, FIT.h * h * (VIEW.w / VIEW.h));
    return markPx < 420 ? 0.25 : markPx < 660 ? 0.2 : 0.16;
  }

  // Width of one glyph in the effect's font, so the grid can be made exact.
  function advance(px, glyph) {
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = `${px}px "courier new", monospace`;
    return ctx.measureText(glyph.repeat(64)).width / 64;
  }

  function buildEffect() {
    effect?.domElement.remove();
    resolution = resolutionFor(stage.clientWidth, stage.clientHeight);

    // AsciiEffect reads the frame back every tick; tell its 2D canvas so.
    const getContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, options) {
      return getContext.call(this, type, type === '2d' ? { ...options, willReadFrequently: true } : options);
    };
    try {
      effect = new AsciiEffect(renderer, CHARSETS[charset], { invert: true, resolution });
    } finally {
      HTMLCanvasElement.prototype.getContext = getContext;
    }

    // To a screen reader this is one picture, not sixteen thousand glyphs.
    effect.domElement.className = 'ascii';
    effect.domElement.style.cursor = '';
    effect.domElement.setAttribute('role', 'img');
    effect.domElement.setAttribute('aria-label', 'The mili wordmark, drawn in characters');
    stage.prepend(effect.domElement);

    // One cell is 1/resolution px wide; close the gap to the glyph's advance.
    stage.style.setProperty('--ls', `${1 / resolution - advance(2 / resolution, CHARSETS[charset].at(-1))}px`);
    fit();
  }

  function fit() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const span = 2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
    camera.aspect = w / h;
    camera.position.z = Math.max(HEIGHT / (FIT.h * span), WIDTH / (FIT.w * span * camera.aspect));
    camera.updateProjectionMatrix();
    effect.setSize(w, h);
  }

  // ── Controls ─────────────────────────────────────────────────────────────

  const hud = document.createElement('div');
  hud.className = 'hud';
  hud.innerHTML = `
    <div class="brand"><b>mili</b><span>THREE.AsciiEffect · live WebGL → characters</span></div>
    <div class="controls"><div class="row" data-k="charset"></div><div class="row" data-k="tint"></div></div>`;
  const readout = document.createElement('div');
  readout.className = 'readout';
  stage.append(hud, readout);
  stage.classList.toggle('bare', query.get('hud') === '0');

  function control(name, table, get, set) {
    const row = hud.querySelector(`[data-k="${name}"]`);
    row.innerHTML = Object.keys(table).map((v) => `<button type="button" data-v="${v}">${v}</button>`).join('');
    const sync = () => row.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('on', b.dataset.v === get());
      b.setAttribute('aria-pressed', b.dataset.v === get());
    });
    row.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;
      set(button.dataset.v);
      sync();
    });
    sync();
  }
  control('charset', CHARSETS, () => charset, (v) => { charset = v; buildEffect(); draw(); report(); });
  control('tint', TINTS, () => tint, (v) => { tint = v; applyTint(); });

  addEventListener('keydown', (e) => {
    if (e.key === 'h' && !e.metaKey && !e.ctrlKey && !e.altKey) stage.classList.toggle('bare');
  });

  // ── Living vocabulary (timings and moods from src/living-logo.js) ─────────

  let clock = 0;                              // ms of animated time; stops when the tab hides
  const queue = [];
  const after = (ms, fn) => queue.push({ at: clock + ms, fn });
  const between = (a, b) => a + Math.random() * (b - a);

  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return (x) => {
      let t = x;
      for (let i = 0; i < 6; i++) {
        const slope = (3 * ax * t + 2 * bx) * t + cx;
        if (Math.abs(slope) < 1e-6) break;
        t -= (((ax * t + bx) * t + cx) * t - x) / slope;
      }
      return ((ay * t + by) * t + cy) * t;
    };
  }
  const easeInOut = bezier(0.42, 0, 0.58, 1);
  const standard = bezier(0.4, 0, 0.2, 1);

  const channel = (...rest) => ({ rest, now: [...rest], from: [...rest], to: [...rest], t0: 0, ms: 0, ease: standard });
  function go(c, to, ms, ease = standard) {
    c.from = [...c.now];
    c.to = to;
    c.t0 = clock;
    c.ms = ms;
    c.ease = ease;
  }
  function settle(c) {
    const p = c.ms > 0 ? Math.min(1, (clock - c.t0) / c.ms) : 1;
    const e = c.ease(p);
    for (let i = 0; i < c.now.length; i++) c.now[i] = c.from[i] + (c.to[i] - c.from[i]) * e;
  }

  const eyeL = channel(1, 0);                 // scaleY, translateX
  const eyeR = channel(1, 0);
  const mouth = channel(0, 0, 1, 1, 0);       // translateX, translateY, scaleX, scaleY, rotate°

  function blinkOnce() {
    go(eyeL, [0.05, 0], 150, easeInOut);
    after(between(30, 70), () => go(eyeR, [0.05, 0], 150, easeInOut));
    after(between(180, 300), () => {
      go(eyeL, [1, 0], 150, easeInOut);
      after(between(30, 70), () => go(eyeR, [1, 0], 150, easeInOut));
    });
  }
  function blink() {
    blinkOnce();
    if (Math.random() < 0.2) after(400, blinkOnce);
  }
  function squint() {
    const amount = between(0.45, 0.7);
    go(eyeL, [amount, 0], 400);
    go(eyeR, [amount + between(-0.05, 0.05), 0], 400);
    after(between(1000, 3000), () => {
      go(eyeL, [1, 0], 150, easeInOut);
      go(eyeR, [1, 0], 150, easeInOut);
    });
  }
  function glance() {
    const shift = (Math.random() < 0.5 ? 1 : -1) * between(20, 50);
    go(eyeL, [1, shift], 400);
    go(eyeR, [1, shift], 400);
    after(between(800, 2000), () => {
      go(eyeL, [1, 0], 400);
      go(eyeR, [1, 0], 400);
    });
  }
  function eyes() {
    const roll = Math.random();
    if (roll < 0.55) blink();
    else if (roll < 0.75) squint();
    else glance();
    after(between(2500, 7000), eyes);
  }

  const MOODS = [
    // tx, ty, sx, sy, rotate°, ms
    [0, 0, 1, 1, 0, 1800],                    // resting
    [0, 12, 1.04, 1.1, 0, 1600],              // content
    [0, 20, 1.07, 1.18, 0, 1400],             // happy
    [0, 26, 1.09, 1.22, 0, 1200],             // very happy
    [0, -8, 0.92, 0.85, 0, 2000],             // pondering
    [20, -10, 0.88, 0.8, 1.5, 2200],          // hmm, right
    [-20, -10, 0.88, 0.8, -1.5, 2200],        // hmm, left
    [10, -5, 0.95, 0.9, 0.8, 2000],           // slight thinking
    [25, 8, 1.03, 1.06, 1.2, 2000],           // smirk right
    [-25, 8, 1.03, 1.06, -1.2, 2000],         // smirk left
    [0, 3, 1.01, 1.02, 0, 2200],              // barely there
  ];
  function mood() {
    const [tx, ty, sx, sy, r, ms] = MOODS[Math.floor(Math.random() * MOODS.length)];
    go(mouth, [tx, ty, sx, sy, r], ms);
    after(between(2000, 5000), mood);
  }
  function wake() {
    after(between(1500, 3000), eyes);
    after(2000, mood);
  }

  // Grabbing it is hovering it: the grin, and the eyes cross.
  function hold(on) {
    queue.length = 0;                         // nothing scheduled may undo the reaction
    go(mouth, on ? [0, 30, 1.12, 1.28, 0] : [...mouth.rest], on ? 400 : 600);
    go(eyeL, [1, on ? 30 : 0], 400);
    go(eyeR, [1, on ? -30 : 0], 400);
    if (!on) wake();
  }

  function pose() {
    for (let i = queue.length - 1; i >= 0; i--) {
      if (queue[i].at <= clock) queue.splice(i, 1)[0].fn();
    }
    for (const c of [eyeL, eyeR, mouth]) settle(c);

    for (const [mesh, c] of [[part['eye-left'], eyeL], [part['eye-right'], eyeR]]) {
      mesh.scale.y = c.now[0];
      mesh.position.x = mesh.userData.home.x + c.now[1];
    }
    const [tx, ty, sx, sy, r] = mouth.now;
    const smile = part.smile;
    smile.position.set(smile.userData.home.x + tx, smile.userData.home.y + ty, 0);
    smile.scale.set(sx, sy, 1);
    smile.rotation.z = THREE.MathUtils.degToRad(r);
  }

  // ── Motion ───────────────────────────────────────────────────────────────

  // Idle is a sway between three-quarter views: the side walls come and go,
  // and the mark is never seen from behind, where it reads "ilim".
  const SWAY = 0.62;                          // radians either side of front
  const NOD = 0.1;
  const euler = new THREE.Euler();
  let idle = 0;                               // seconds of idle swaying

  const user = new THREE.Quaternion();        // what dragging has added on top
  const HOME = new THREE.Quaternion();
  const nudge = new THREE.Quaternion();
  const axis = new THREE.Vector3();
  const spin = { yaw: 0, pitch: 0 };          // radians per frame, carried after release
  const drag = { on: false, x: 0, y: 0, dx: 0, dy: 0 };
  let homeAt = 0;

  // Trackball: turn about the screen's own axes, whatever way the mark faces.
  function turn(yaw, pitch) {
    axis.set(pitch, yaw, 0);
    const angle = axis.length();
    if (angle < 1e-6) return;
    user.premultiply(nudge.setFromAxisAngle(axis.normalize(), angle));
  }

  stage.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || e.button !== 0 || e.target.closest('.hud')) return;
    drag.on = true;
    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.dx = drag.dy = 0;
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('grab');
    if (!still) hold(true);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!drag.on) return;
    drag.dx += e.clientX - drag.x;
    drag.dy += e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    if (still) requestAnimationFrame(() => step(0));
  });
  function release() {
    if (!drag.on) return;
    drag.on = false;
    stage.classList.remove('grab');
    homeAt = clock + 1200;
    if (still) requestAnimationFrame(() => step(0));
    else hold(false);
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);

  function step(dt) {
    clock += dt;

    if (drag.on) {
      const yaw = drag.dx * 0.006;
      const pitch = drag.dy * 0.006;
      drag.dx = drag.dy = 0;
      turn(yaw, pitch);
      spin.yaw += (yaw - spin.yaw) * 0.5;
      spin.pitch += (pitch - spin.pitch) * 0.5;
    } else if (!still) {
      // Coast on what the drag left, then turn back to face the viewer.
      turn(spin.yaw, spin.pitch);
      spin.yaw *= 0.94;
      spin.pitch *= 0.94;
      if (clock > homeAt && Math.hypot(spin.yaw, spin.pitch) < 0.01) user.slerp(HOME, 0.06);
      idle += dt / 1000;
    }

    if (still) {
      euler.set(0.08, -0.4, 0, 'XYZ');
    } else {
      euler.set(0.03 + NOD * Math.sin(idle * 0.37 + 1.3), SWAY * Math.sin(idle * 0.55 - 1), 0, 'XYZ');
    }
    pivot.quaternion.setFromEuler(euler).premultiply(user);
    key.position.x = -4 * Math.cos(clock * 0.0004);

    pose();
    draw();
  }

  function draw() {
    effect.render(scene, camera);
  }

  function report() {
    const glyphs = `${CHARSETS[charset].length} glyphs`;
    readout.textContent = still
      ? `${glyphs} · drag to turn`
      : `${glyphs} · ${fps ? `${fps} fps · ` : ''}drag to spin`;
  }

  let raf = 0;
  let last = 0;
  let frames = 0;
  let fps = 0;
  let sampled = 0;

  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (now - last < 32) return;               // ~30fps on any refresh rate
    const dt = Math.min(now - last, 100);
    last = now;
    step(dt);

    if (!sampled) sampled = now;
    else frames++;
    if (now - sampled > 500) {
      fps = Math.round((frames * 1000) / (now - sampled));
      frames = 0;
      sampled = now;
    }
    report();
  }

  addEventListener('resize', () => {
    if (resolutionFor(stage.clientWidth, stage.clientHeight) === resolution) fit();
    else buildEffect();
    if (still) draw();
  });

  buildEffect();
  step(0);
  report();

  if (!still) {
    wake();
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(raf);
      if (!document.hidden) {
        last = sampled = 0;
        raf = requestAnimationFrame(frame);
      }
    });
    raf = requestAnimationFrame(frame);
  }
</script>
</body>
</html>
